<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:wght@700&family=Montserrat:wght@500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./design/styles.css" />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Product preview card component</title>
  </head>

  <body>
    <main>
      <div class="card">
        <div class="card__image">
          <picture>
            <source
              media="(min-width:600px)"
              srcset="./images/image-product-desktop.jpg"
            />
            <img
              src="./images/image-product-mobile.jpg"
              alt="Perfume bottle"
              class="card__img"
            />
          </picture>
        </div>

        <div class="card__content">
          <p class="card__perfume">PERFUME</p>
          <h2 class="card__content--brand">Gabrielle Essence Eau De Parfum</h2>
          <p class="card__content--description">
            A floral, solar and voluptuous interpretation composed by Olivier
            Polge, Perfumer-Creator for the House of CHANEL.
          </p>
          <div class="card__content--price">
            <span class="price">$149.99</span>
            <span class="price--original">$169.99</span>
          </div>
          <button class="card__content--button">
            <img
              src="./images/icon-cart.svg"
              alt="Shopping cart icon"
              class="cart__icon"
            />
            Add to Cart
          </button>
        </div>
      </div>
    </main>
  </body>
</html>
